const LIBRARY = RAW.map((r, i) => ({
  id: "k" + i,
  text: r[0],
  cat: r[1],
  seasons: r[2],
  weekend: r[3] === 1,
}));

function hashStr(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h;
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function toDateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function dateKeyToDate(key){
  const p = key.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function addDaysKey(key, delta){
  const d = dateKeyToDate(key);
  d.setDate(d.getDate() + delta);
  return toDateKey(d);
}
function seasonOf(key){
  const m = dateKeyToDate(key).getMonth() + 1;
  for (const s of Object.keys(SEASONS)) if (SEASONS[s].months.includes(m)) return s;
  return "spring";
}
function isWeekendKey(key){
  const d = dateKeyToDate(key).getDay();
  return d === 0 || d === 6;
}
function weekdayLabel(key){ return "周" + WEEKDAY_CN[dateKeyToDate(key).getDay()]; }
function dateLabelCN(key){
  const d = dateKeyToDate(key);
  return d.getMonth() + 1 + "月" + d.getDate() + "日";
}
function eligiblePool(season, weekend){
  return LIBRARY.filter(x => x.seasons.includes(season) && (!x.weekend || weekend));
}
function pickIndex(dateKey, offset){
  const pool = eligiblePool(seasonOf(dateKey), isWeekendKey(dateKey));
  if (!pool.length) return null;
  return pool[hashStr(dateKey + "#" + offset) % pool.length];
}
function pickChallenge(dateKey, offset){
  const idx = pickIndex(dateKey, offset);
  return idx ? { challenge: idx, offset } : null;
}
// doneSet: Set of "YYYY-MM-DD"。今天没做时，从昨天往前数连续天数。
function computeStreak(doneSet, dateKey){
  let cursor = doneSet.has(dateKey) ? dateKey : addDaysKey(dateKey, -1);
  let n = 0;
  while (doneSet.has(cursor)){ n++; cursor = addDaysKey(cursor, -1); }
  return n;
}

function validateLibrary(){
  const errors = [];
  const counts = {};
  const seen = new Map();
  const total = LIBRARY.length;
  for (const x of LIBRARY){
    if (typeof x.text !== "string" || !x.text.trim()) errors.push("空文案: " + x.id);
    if (!CATS[x.cat]) errors.push("非法类别: " + x.id + " -> " + x.cat);
    if (!Array.isArray(x.seasons) || !x.seasons.length) errors.push("缺少季节: " + x.id);
    else for (const s of x.seasons) if (!SEASONS[s]) errors.push("非法季节: " + x.id + " -> " + s);
    if (typeof x.weekend !== "boolean") errors.push("weekend 非布尔: " + x.id);
    const t = x.text.trim();
    if (seen.has(t)) errors.push("重复文案: " + t);
    seen.set(t, x.id);
    for (const s of (x.seasons || [])){ counts[s] = counts[s] || {}; counts[s][x.cat] = (counts[s][x.cat] || 0) + 1; }
  }
  for (const s of Object.keys(SEASONS)){
    for (const c of Object.keys(CATS)){
      const n = (counts[s] && counts[s][c]) || 0;
      if (n < 7) errors.push(s + "/" + c + " 仅 " + n + " 条（要求 ≥7）");
    }
  }
  return { ok: errors.length === 0, errors, counts, total };
}

function runSelfTest(){
  const checks = [];
  const lib = validateLibrary();
  checks.push({ name: "题库完整性", pass: lib.ok, detail: lib.ok ? "共 " + lib.total + " 条，每季每类 ≥7" : lib.errors.join("；") });

  const alt = pickChallenge("2026-08-20", 3);

  const streak = computeStreak(new Set(["2026-08-18","2026-08-19","2026-08-20"]), "2026-08-20");
  checks.push({ name: "连续打卡计算", pass: streak === 3, detail: "连续 " + streak + " 天" });
  const broken = computeStreak(new Set(["2026-08-18","2026-08-20"]), "2026-08-20");
  checks.push({ name: "断档清零", pass: broken === 1, detail: "断档后连续 " + broken + " 天" });

    heart(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.13); c.lineJoin = "round";
      c.fillStyle = C.rose; c.strokeStyle = C.ink;
      c.beginPath();
      c.moveTo(0, s * 0.85);
      c.bezierCurveTo(-s * 1.15, 0, -s * 0.7, -s * 0.95, 0, -s * 0.3);
      c.bezierCurveTo(s * 0.7, -s * 0.95, s * 1.15, 0, 0, s * 0.85);
      c.closePath(); c.fill(); c.stroke();
      c.restore();
    },
    cup(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.12); c.lineJoin = "round"; c.lineCap = "round";
      c.fillStyle = C.blue; c.strokeStyle = C.ink;
      c.beginPath();
      c.moveTo(-s * 0.55, -s * 0.5); c.lineTo(s * 0.55, -s * 0.5);
      c.lineTo(s * 0.4, s * 0.5); c.lineTo(-s * 0.4, s * 0.5);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.arc(s * 0.55, 0, s * 0.22, -Math.PI * 0.45, Math.PI * 0.45); c.stroke();
      c.lineWidth = Math.max(2, s * 0.1);
      c.beginPath(); c.moveTo(-s * 0.15, -s * 0.75); c.quadraticCurveTo(-s * 0.28, -s * 0.95, -s * 0.12, -s * 1.1); c.stroke();
      c.beginPath(); c.moveTo(s * 0.15, -s * 0.75); c.quadraticCurveTo(s * 0.02, -s * 0.95, s * 0.18, -s * 1.1); c.stroke();
      c.restore();
    },
    mail(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.11); c.lineJoin = "round"; c.lineCap = "round";
      c.fillStyle = C.beige; c.strokeStyle = C.ink;
      c.beginPath();
      c.moveTo(-s, -s * 0.6); c.lineTo(s, -s * 0.6); c.lineTo(s, s * 0.6); c.lineTo(-s, s * 0.6);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-s, -s * 0.6); c.lineTo(0, -s * 0.05); c.lineTo(s, -s * 0.6); c.stroke();
      c.beginPath(); c.moveTo(-s, s * 0.6); c.lineTo(-s * 0.15, 0); c.moveTo(s, s * 0.6); c.lineTo(s * 0.15, 0); c.stroke();
      c.restore();
    },
    star(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.13); c.lineJoin = "round";
      c.fillStyle = C.mustard; c.strokeStyle = C.ink;
      c.beginPath();
      for (let i = 0; i < 10; i++){
        const r = i % 2 === 0 ? s : s * 0.45;
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        i === 0 ? c.moveTo(Math.cos(a) * r, Math.sin(a) * r) : c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      c.closePath(); c.fill(); c.stroke();
      c.restore();
    },
    flower(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.12); c.lineJoin = "round";
      c.fillStyle = C.mauve; c.strokeStyle = C.ink;
      for (let i = 0; i < 5; i++){
        c.save(); c.rotate(i * Math.PI * 2 / 5);
        c.beginPath(); c.ellipse(0, -s * 0.62, s * 0.3, s * 0.42, 0, 0, Math.PI * 2); c.fill(); c.stroke();
        c.restore();
      }
      c.fillStyle = C.mustard;
      c.beginPath(); c.arc(0, 0, s * 0.3, 0, Math.PI * 2); c.fill(); c.stroke();
      c.restore();
    },
    leaf(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.13); c.lineJoin = "round"; c.lineCap = "round";
      c.fillStyle = C.olive; c.strokeStyle = C.ink;
      c.beginPath();
      c.moveTo(-s, 0); c.quadraticCurveTo(-s * 0.2, -s * 1.1, s * 0.9, -s * 0.15);
      c.quadraticCurveTo(0, s * 0.9, -s, 0);
      c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-s * 0.75, s * 0.05); c.quadraticCurveTo(0, 0, s * 0.7, -s * 0.05); c.stroke();
      c.restore();
    },
    blob(c, s){
      c.save(); c.lineWidth = Math.max(2.5, s * 0.13); c.lineJoin = "round";
      c.fillStyle = C.sage; c.strokeStyle = C.ink;
      c.beginPath();
      const pts = 7;
      for (let i = 0; i < pts; i++){
        const a = (i / pts) * Math.PI * 2;
        const r = s * (0.8 + 0.3 * Math.sin(i * 2.7));
        i === 0 ? c.moveTo(Math.cos(a) * r, Math.sin(a) * r) : c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      c.closePath(); c.fill(); c.stroke();
      c.restore();
    },
  };
  const TYPES = Object.keys(SHAPES);

  function spawnFields(){
    const m = Math.min(W, H);
    fields = [
      { x: W * 0.1, y: H * 0.12, r: m * 0.36, color: C.mustard, alpha: 0.10, phase: rand(0, 6) },
      { x: W * 0.92, y: H * 0.88, r: m * 0.4, color: C.blue, alpha: 0.09, phase: rand(0, 6) },
      { x: W * 0.82, y: H * 0.16, r: m * 0.2, color: C.mauve, alpha: 0.07, phase: rand(0, 6) },
      { x: W * 0.12, y: H * 0.86, r: m * 0.24, color: C.sage, alpha: 0.08, phase: rand(0, 6) },
    ];
  }
  function drawFields(t){
    for (const f of fields){
      ctx.globalAlpha = f.alpha * (0.85 + 0.15 * Math.sin(t * 0.0004 + f.phase));
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 远景小山：扁平色块，缓慢左右摆动
  function drawHills(t){
    const sway = Math.sin(t * 0.0002) * 8;
    ctx.fillStyle = C.olive; ctx.globalAlpha = 0.16;
    ctx.beginPath(); ctx.arc(W * 0.26 + sway * 0.5, H + 70, W * 0.5, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.86 - sway * 0.5, H + 100, W * 0.55, Math.PI, 0); ctx.fill();
    ctx.fillStyle = C.sage; ctx.globalAlpha = 0.22;
    ctx.beginPath(); ctx.arc(W * 0.55 + sway, H + 50, W * 0.42, Math.PI, 0); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function spawnAnchors(){
    anchors = [];
    const m = Math.min(W, H);
    const cands = [
      { type: 'sun',    x: W * 0.9, y: H * 0.14, size: m * 0.11, alpha: 0.95 },
      { type: 'cloud',  x: W * 0.1, y: H * 0.16, size: m * 0.085, alpha: 0.85 },
      { type: 'blob',   x: W * 0.05, y: H * 0.92, size: m * 0.1, alpha: 0.75 },
      { type: 'flower', x: W * 0.95, y: H * 0.88, size: m * 0.075, alpha: 0.8 },
    ];
    for (const a of cands){
      const r = a.size * 1.5;
      if (a.x + r > keepOut.x0 && a.x - r < keepOut.x1 && a.y + r > keepOut.y0 && a.y - r < keepOut.y1) continue;
      a.phase = rand(0, 6);
      anchors.push(a);
    }
  }
  function spawnGrains(){
    grains = [];
    const count = Math.round((W * H) / 6200);
    for (let i = 0; i < count; i++){
      const x = rand(0, W), y = rand(0, H);
      if (x > keepOut.x0 && x < keepOut.x1 && y > keepOut.y0 && y < keepOut.y1) continue;
      grains.push({ x, y, r: rand(0.4, 1.2), alpha: rand(0.03, 0.07), color: Math.random() < 0.75 ? C.ink : C.mustard });
    }
  }
  function spawnShape({ initial = false, x, y, ambient = true } = {}){
    const sx = x != null ? x : rand(0, W);
    const sy = y != null ? y : (initial ? rand(0, H) : H + rand(20, 60));
    shapes.push({
      type: TYPES[Math.floor(Math.random() * TYPES.length)],
      x: sx, y: sy, size: rand(16, 38),
      vy: rand(0.25, 0.55), vx: (Math.random() - 0.5) * 0.06,
      rot: rand(-0.3, 0.3), phase: rand(0, Math.PI * 2),
      alpha: rand(0.62, 0.95), ambient,
    });
  }
  function bounceShape(d){
    const r = d.size * 1.6;
    const x = d.x, y = d.y;
    if (!(x > keepOut.x0 - r && x < keepOut.x1 + r && y > keepOut.y0 - r && y < keepOut.y1 + r)) return;
    const left = x - (keepOut.x0 - r), right = (keepOut.x1 + r) - x;
    const top = y - (keepOut.y0 - r), bottom = (keepOut.y1 + r) - y;
    const m = Math.min(left, right, top, bottom);
    if (m === left){ d.x = keepOut.x0 - r; d.vx = Math.abs(d.vx) + 0.03; }
    else if (m === right){ d.x = keepOut.x1 + r; d.vx = -Math.abs(d.vx) - 0.03; }
    else if (m === top){ d.y = keepOut.y0 - r; d.vy = Math.abs(d.vy) + 0.03; }
    else { d.y = keepOut.y1 + r; d.vy = -Math.abs(d.vy) - 0.03; }
    d.rot += 0.05;
  }
  function drawShape(d, t){
    const bob = Math.sin(t * 0.00025 + d.phase) * 0.7;
    ctx.save();
    ctx.translate(d.x, d.y + bob);
    ctx.rotate(d.rot + Math.sin(t * 0.00018 + d.phase) * 0.12);
    ctx.globalAlpha = d.alpha;
    SHAPES[d.type](ctx, d.size);
    ctx.restore();
  }
  let frameCount = 0;
  function drawFrame(t){
    if (++frameCount % 150 === 1) keepOut = computeKeepOut();
    ctx.clearRect(0, 0, W, H);
    drawFields(t);
    drawHills(t);
    // 四角构图元素：缓慢浮动呼吸
    for (const a of anchors){
      const bob = Math.sin(t * 0.00022 + a.phase) * 4;
      ctx.save();
      ctx.translate(a.x, a.y + bob);
      ctx.rotate(Math.sin(t * 0.00015 + a.phase) * 0.06);
      ctx.globalAlpha = a.alpha * (0.92 + 0.08 * Math.sin(t * 0.0003 + a.phase));
      SHAPES[a.type](ctx, a.size);
      ctx.restore();
    }
    // 纸张颗粒
    for (const g of grains){
      ctx.globalAlpha = g.alpha; ctx.fillStyle = g.color;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 漂浮插画图形：向上飘、轻摆，碰到中央卡片会被弹开
    for (let i = shapes.length - 1; i >= 0; i--){
      const d = shapes[i];
      if (!reduced){
        d.y -= d.vy; d.x += d.vx;
        if (d.y < -60 || d.x < -60 || d.x > W + 60){ shapes.splice(i, 1); if (d.ambient) spawnShape(); continue; }
        bounceShape(d);
      }
      drawShape(d, t);
    }
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    keepOut = computeKeepOut();
    shapes = []; fields = []; anchors = [];
    spawnFields();
    spawnGrains();
    spawnAnchors();
    for (let i = 0; i < 13; i++) spawnShape({ initial: true });
  }
  function loop(now){ drawFrame(now); requestAnimationFrame(loop); }
  window.addEventListener("resize", resize);
  resize();
  if (reduced){ drawFrame(0); } else { requestAnimationFrame(loop); }
  // 点击任意处：绽放一个编辑插画小图形
  window.addEventListener("pointerdown", (e) => {
    spawnShape({ x: e.clientX, y: e.clientY, ambient: false });
  }, { passive: true });

  /* ---------- 自检 ---------- */
  if (params.get("selftest") != null){
    const r = runSelfTest();
    const box = $("#selftestBody");
    box.innerHTML = r.checks.map(c =>
      "<div class=\"" + (c.pass ? "ok" : "bad") + "\">" + (c.pass ? "✓" : "✗") + " " + c.name + "</div><div style='color:#8a6f5a'>" + c.detail + "</div>"
    ).join("");
    $("#selftest").style.display = "block";
    console.table(r.checks);
  }

  /* ---------- 启动 ---------- */
  render();
  setSound(soundOn);
})();
</script>
</body>
</html>
